name: Pages sync

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Pages if version mismatch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check version mismatch
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          live="$(curl -sf https://fleet.cenvero.org/manifest.json | jq -r '.channels.stable.version' 2>/dev/null || echo '')"
          latest="$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name' 2>/dev/null || echo '')"
          echo "live=${live}"
          echo "latest=${latest}"
          if [ -z "${live}" ] || [ -z "${latest}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          elif [ "${live}" != "${latest}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.deploy == 'true'
        with:
          ref: main

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        if: steps.check.outputs.deploy == 'true'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.check.outputs.deploy == 'true'
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
        if: steps.check.outputs.deploy == 'true'
