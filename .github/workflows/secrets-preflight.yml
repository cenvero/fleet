name: secrets-preflight

# Release secrets are otherwise only exercised by release.yml, which runs on a
# "v*" tag — so a rotated password, an expired token or a mismatched public key
# is discovered mid-release, after the tag is already public. This runs the same
# checks on every push to main (plus weekly, to catch expiry that happens while
# nothing is being pushed) so the failure surfaces before a release is cut.

on:
  push:
    branches:
      - main
  schedule:
    # Weekly: token expiry is time-based, not push-based.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows-valid:
    name: Validate workflow files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Lint workflows
        run: actionlint -color

      - name: Check every referenced secret is covered by preflight
        # Keeps this workflow from silently going stale: if another workflow
        # starts using a new secret, preflight must learn to validate it.
        run: |
          set -euo pipefail
          covered="GITHUB_TOKEN MINISIGN_SECRET_KEY MINISIGN_PASSWORD MINISIGN_PUBLIC_KEY HOMEBREW_TOKEN"
          unknown=0
          referenced="$(grep -rhoE 'secrets\.[A-Z0-9_]+' .github/workflows \
            | sed 's/^secrets\.//' | sort -u)"
          for name in ${referenced}; do
            case " ${covered} " in
              *" ${name} "*) ;;
              *)
                echo "::error::${name} is used by a workflow but is not validated by secrets-preflight.yml"
                unknown=1
                ;;
            esac
          done
          [ "${unknown}" -eq 0 ] || exit 1
          echo "all referenced secrets are covered"

  release-secrets:
    name: Validate release secrets
    runs-on: ubuntu-latest
    # Forks do not receive secrets; skip rather than fail misleadingly.
    if: github.repository == 'cenvero/fleet'
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets are configured
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for name in MINISIGN_SECRET_KEY MINISIGN_PASSWORD MINISIGN_PUBLIC_KEY HOMEBREW_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::secret ${name} is not configured on this repository"
              missing=1
            fi
          done
          [ "${missing}" -eq 0 ] || exit 1

      - name: Validate format
        # Same script release.yml runs, so preflight cannot drift from it.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: ./scripts/validate-release-env.sh

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign

      - name: Signing round-trip
        # validate-release-env.sh only checks presence and encoding. This proves
        # the three secrets actually work TOGETHER: that MINISIGN_PASSWORD
        # unlocks MINISIGN_SECRET_KEY, and that MINISIGN_PUBLIC_KEY verifies what
        # that key signs. A rotated password or a stale public key passes the
        # format check and then fails inside goreleaser — this catches it here.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"
          trap 'rm -rf "${work}"' EXIT INT TERM

          printf '%s' "${MINISIGN_SECRET_KEY}" | base64 -d > "${work}/minisign.key"
          printf 'secrets-preflight probe for %s\n' "${GITHUB_SHA}" > "${work}/probe.txt"

          # Password over stdin and the same argv shape as .goreleaser.yml's
          # signs block, so this exercises the real signing path. stderr is
          # captured rather than printed: never risk echoing key material.
          if ! printf '%s' "${MINISIGN_PASSWORD}" \
            | minisign -Sm "${work}/probe.txt" \
                -s "${work}/minisign.key" \
                -x "${work}/probe.minisig" >/dev/null 2>"${work}/sign.err"; then
            echo "::error::MINISIGN_PASSWORD does not unlock MINISIGN_SECRET_KEY — signing would fail during release"
            exit 1
          fi

          pub="$(printf '%s\n' "${MINISIGN_PUBLIC_KEY}" | awk 'NF { line = $0 } END { print line }')"
          if ! minisign -Vm "${work}/probe.txt" -P "${pub}" \
                -x "${work}/probe.minisig" >/dev/null 2>&1; then
            echo "::error::MINISIGN_PUBLIC_KEY does not match MINISIGN_SECRET_KEY — published signatures would not verify"
            exit 1
          fi

          echo "minisign: secret key, password and public key are mutually consistent"

      - name: Validate HOMEBREW_TOKEN
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          TAP_REPO: cenvero/homebrew-fleet
        run: |
          set -euo pipefail
          hdr="$(mktemp)"
          trap 'rm -f "${hdr}"' EXIT INT TERM

          code="$(curl -sS -o /dev/null -D "${hdr}" -w '%{http_code}' \
            -H "Authorization: Bearer ${HOMEBREW_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)"
          if [ "${code}" != "200" ]; then
            echo "::error::HOMEBREW_TOKEN rejected by GitHub (HTTP ${code}) — expired, revoked or malformed"
            exit 1
          fi

          # goreleaser pushes the formula to the tap; read access is not enough.
          perms="$(curl -sS \
            -H "Authorization: Bearer ${HOMEBREW_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${TAP_REPO}" \
            | jq -r '.permissions.push // "false"')"
          if [ "${perms}" != "true" ]; then
            echo "::error::HOMEBREW_TOKEN cannot push to ${TAP_REPO} — the formula update would fail"
            exit 1
          fi

          # Fine-grained tokens report their expiry in a response header.
          expiry="$(grep -i '^github-authentication-token-expiration:' "${hdr}" \
            | cut -d: -f2- | tr -d '\r' | sed 's/^ *//' || true)"
          if [ -z "${expiry}" ]; then
            echo "HOMEBREW_TOKEN: valid, can push to ${TAP_REPO} (no expiry reported)"
          else
            now="$(date -u +%s)"
            exp_ts="$(date -u -d "${expiry}" +%s 2>/dev/null || echo 0)"
            if [ "${exp_ts}" -eq 0 ]; then
              echo "HOMEBREW_TOKEN: valid, can push to ${TAP_REPO} (expiry '${expiry}' unparsed)"
            else
              days=$(( (exp_ts - now) / 86400 ))
              if [ "${days}" -lt 14 ]; then
                echo "::warning::HOMEBREW_TOKEN expires in ${days} day(s) (${expiry}) — rotate before the next release"
              fi
              echo "HOMEBREW_TOKEN: valid, can push to ${TAP_REPO}, expires in ${days} day(s)"
            fi
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release secrets preflight"
            echo ""
            echo "Checked against \`release.yml\` and \`.goreleaser.yml\`:"
            echo ""
            echo "- \`MINISIGN_SECRET_KEY\` / \`MINISIGN_PASSWORD\` / \`MINISIGN_PUBLIC_KEY\` — real sign + verify round-trip"
            echo "- \`HOMEBREW_TOKEN\` — accepted by GitHub, push access to \`cenvero/homebrew-fleet\`, expiry"
          } >> "${GITHUB_STEP_SUMMARY}"
