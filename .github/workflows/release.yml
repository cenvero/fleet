name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require release tag on main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" origin/main || {
            echo "::error::release tag commit is not an ancestor of origin/main"
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Validate release secrets
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: ./scripts/validate-release-env.sh
      - name: Materialize owner-only signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .release
          printf '%s' "${MINISIGN_SECRET_KEY}" | base64 -d > .release/minisign.key
          chmod 0600 .release/minisign.key
          test "$(stat -c '%a' .release/minisign.key)" = 600
      - name: Sync and validate signing assets
        env:
          FLEET_MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          ./scripts/sync-signing-key.sh
          ./scripts/validate-signing-assets.sh
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Release with GoReleaser v2.17.1
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          MINISIGN_KEY_FILE: .release/minisign.key
      - name: Remove signing key
        if: always()
        run: |
          if [ -f .release/minisign.key ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u .release/minisign.key
            else
              rm -f .release/minisign.key
            fi
          fi
          rmdir .release 2>/dev/null || true
      - name: Upload release dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dist
          path: dist

  update-manifest:
    name: Update manifest
    runs-on: ubuntu-latest
    needs: goreleaser
    environment: release
    permissions:
      actions: read
      contents: write
    outputs:
      sha: ${{ steps.manifest-commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist
      - name: Require release tag on current main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git merge-base --is-ancestor "${tag_commit}" origin/main || {
            echo "::error::release tag commit is not an ancestor of origin/main"
            exit 1
          }
          git reset --hard origin/main
      - name: Select channel
        id: channel
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -alpha\. ]]; then echo "value=alpha" >>"${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_REF_NAME}" =~ -(beta|rc)\. ]]; then echo "value=beta" >>"${GITHUB_OUTPUT}"
          else echo "value=stable" >>"${GITHUB_OUTPUT}"
          fi
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Generate and validate manifest
        env:
          FLEET_MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
          FLEET_VERSION: ${{ github.ref_name }}
          FLEET_CHANNEL: ${{ steps.channel.outputs.value }}
          FLEET_RELEASE_NOTES_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          FLEET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/sync-signing-key.sh
          FLEET_RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export FLEET_RELEASE_DATE
          ./scripts/update-manifest.sh
          ./scripts/validate-release-manifest.sh
      - name: Commit manifest without rebasing tag history
        id: manifest-commit
        run: |
          set -euo pipefail
          git config user.name cenvero-bot
          git config user.email 276044322+cenvero-bot@users.noreply.github.com
          git add public/manifest.json public/signing.pub public/install.sh public/install.ps1 internal/update/signing.pub
          git diff --cached --quiet && { echo "::error::release produced no manifest change"; exit 1; }
          git commit -m "chore(release): update manifest for ${GITHUB_REF_NAME}"
          # A concurrent main update causes a non-fast-forward failure. Never
          # rebase/cherry-pick the release tag history into main automatically.
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >>"${GITHUB_OUTPUT}"

  smoke-test:
    name: Smoke test release
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
    steps:
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y minisign
      - name: Require complete signed release asset matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')"
          version="${GITHUB_REF_NAME#v}"
          for binary in fleet fleet-agent; do
            for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 linux_armv7 windows_amd64 windows_arm64; do
              ext=tar.gz; [[ "${target}" == windows_* ]] && ext=zip
              name="${binary}_${version}_${target}.${ext}"
              grep -Fx "${name}" <<<"${assets}" >/dev/null
              grep -Fx "${name}.minisig" <<<"${assets}" >/dev/null
            done
          done
      - name: Download and verify Linux archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --repo "${{ github.repository }}" \
            --pattern 'fleet_*_linux_amd64.tar.gz' --pattern 'fleet_*_linux_amd64.tar.gz.minisig' \
            --pattern 'fleet-agent_*_linux_amd64.tar.gz' --pattern 'fleet-agent_*_linux_amd64.tar.gz.minisig'
          pub="$(printf '%s\n' "${MINISIGN_PUBLIC_KEY}" | awk 'NF{line=$0}END{print line}')"
          version="${GITHUB_REF_NAME}"
          for binary in fleet fleet-agent; do
            archive="$(find . -maxdepth 1 -name "${binary}_*_linux_amd64.tar.gz" -print -quit)"
            test -n "${archive}"
            minisign -Vm "${archive}" -P "${pub}" -x "${archive}.minisig" >/dev/null
            comment="$(sed -n '3s/^trusted comment: //p' "${archive}.minisig")"
            test "${comment}" = "cenvero-fleet ${binary} ${version} linux-amd64"
          done
          tar -xzf "$(find . -maxdepth 1 -name 'fleet_*_linux_amd64.tar.gz' -print -quit)"
          ./fleet --version

  prepare-winget:
    name: Prepare WinGet submission
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    needs: [goreleaser, smoke-test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-dist
          path: dist
      - name: Generate WinGet 1.12 portable manifests
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          x64_name="fleet_${version}_windows_amd64.zip"
          arm64_name="fleet_${version}_windows_arm64.zip"
          x64_path="$(find dist -type f -name "${x64_name}" -print -quit)"
          arm64_path="$(find dist -type f -name "${arm64_name}" -print -quit)"
          test -n "${x64_path}" && test -n "${arm64_path}"
          x64_sha="$(sha256sum "${x64_path}" | awk '{print $1}')"
          arm64_sha="$(sha256sum "${arm64_path}" | awk '{print $1}')"
          output="winget/manifests/c/Cenvero/Fleet/${version}"
          ./scripts/generate-winget-manifests.sh \
            "${version}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${x64_name}" "${x64_sha}" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${arm64_name}" "${arm64_sha}" \
            "${output}"
          ./scripts/validate-winget-manifests.sh "${output}" "${x64_path}" "${arm64_path}"
          ./scripts/test-winget-manifests.sh
      - name: Upload WinGet manifest bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: winget-manifests-${{ github.ref_name }}
          path: winget/manifests

  validate-winget:
    name: Validate WinGet install/uninstall
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    needs: prepare-winget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: winget-manifests-${{ github.ref_name }}
          path: winget/manifests
      - name: Validate and smoke-test local manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $manifestDir = Join-Path $PWD "winget/manifests/c/Cenvero/Fleet/$version"
          ./scripts/smoke-test-winget-release.ps1 -ManifestDirectory $manifestDir -ExpectedVersion $version

  dispatch-pages:
    name: Dispatch Pages from main
    runs-on: ubuntu-latest
    needs: [update-manifest, smoke-test]
    permissions:
      actions: write
    steps:
      - name: Dispatch main-branch Pages workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main
