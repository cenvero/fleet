name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: gofmt check
        run: |
          # -print0/-0 so paths containing spaces stay one argument, and -r so an
          # empty match does not leave gofmt reading stdin.
          unformatted="$(find . -name '*.go' -print0 | xargs -0 -r gofmt -l)"
          test -z "${unformatted}"
      - name: go mod tidy must be clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: Install staticcheck (pinned)
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run staticcheck
        run: staticcheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test -race -cover ./...

  build-matrix:
    name: Build (${{ matrix.goos }} / ${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/cenvero/fleet/internal/version.Version=${GITHUB_REF_NAME:-dev}" -o "dist/fleet-${GOOS}-${GOARCH}" ./cmd/fleet
          go build -trimpath -ldflags="-s -w -X github.com/cenvero/fleet/internal/version.Version=${GITHUB_REF_NAME:-dev}" -o "dist/fleet-agent-${GOOS}-${GOARCH}" ./cmd/fleet-agent

  windows-test:
    name: Windows install-manager tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Test WinGet ownership and lifecycle behavior
        shell: pwsh
        run: |
          go test ./internal/core -run 'Test(DetectInstallManager|InstallManagerCommands|RegisteredWinGetLocationOwnsOnlyRegisteredExecutable|ApplyFleetUpdateSkipsControllerForWinGetInstall|WindowsAgentDeliveryPreservesObservedVersionUntilReconnect)$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/cli -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Install scanners
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gosec
        run: gosec ./...

  manifest-validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate JSON syntax
        run: jq empty public/manifest.json
      - name: Validate schema basics
        run: |
          jq -e '(.channels | has("stable") and has("beta") and has("alpha")) and (.binaries | type == "object") and (.agent_binaries | type == "object")' public/manifest.json >/dev/null
      - name: Validate release tooling
        run: ./scripts/test-release-tools.sh

  release-guardrails:
    name: Validate release guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate placeholder secret rejection
        env:
          MINISIGN_SECRET_KEY: bm90LWEtcmVhbC1zZWNyZXQ=
          MINISIGN_PASSWORD: test-password
          MINISIGN_PUBLIC_KEY: |
            untrusted comment: placeholder
            REPLACE_WITH_MINISIGN_PUBLIC_KEY
          RELEASE_BOT_TOKEN: test-token
        run: |
          if ./scripts/validate-release-env.sh; then
            echo "expected placeholder public key to be rejected" >&2
            exit 1
          fi

  deploy-pages:
    name: Deploy Pages
    # Skip the release manifest commit: during a release, release.yml deploys
    # Pages once — after the manifest commit AND the smoke test — so the published
    # site always matches the committed manifest. Letting this job also fire on
    # that commit caused a second, racing Pages deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    needs: [manifest-validate]
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
