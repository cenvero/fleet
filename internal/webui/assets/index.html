        <div class="head-actions">
          <button type="button" class="icon-btn sm act-refresh" aria-label="Refresh" title="Refresh"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          <button type="button" class="icon-btn sm act-pane-menu" aria-label="Pane options" aria-haspopup="menu" title="More"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
          <button type="button" class="icon-btn sm act-close" aria-label="Close pane" title="Close pane"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </header>

      <div class="pane-toolbar">
        <label class="field filter">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="filter-input" type="search" placeholder="Filter this folder" aria-label="Filter this folder" spellcheck="false" autocomplete="off" />
          <kbd class="filter-kbd" aria-hidden="true">/</kbd>
        </label>
        <div class="tools">
          <button type="button" class="btn ghost tool-newfolder" title="New folder"><svg class="i" aria-hidden="true"><use href="#i-folder-plus"/></svg><span class="lbl">New folder</span></button>
          <button type="button" class="btn ghost tool-upload" title="Upload files"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span class="lbl">Upload</span></button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button type="button" class="icon-btn sm tool-hidden" aria-pressed="false" aria-label="Show hidden files" title="Show hidden files (.)"><svg class="i" aria-hidden="true"><use href="#i-eye-off"/></svg></button>
          <button type="button" class="icon-btn sm tool-view" aria-pressed="false" aria-label="Icon view" title="Toggle icon view (V)"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
          <button type="button" class="icon-btn sm tool-preview" aria-pressed="false" aria-label="Preview panel" title="Preview (P)"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg></button>
        </div>
        <input type="file" class="file-input" multiple hidden tabindex="-1" />
      </div>

      <div class="selbar" role="toolbar" aria-label="Selection" hidden>
        <button type="button" class="icon-btn sm sel-clear" aria-label="Clear selection" title="Clear selection (Esc)"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        <span class="sel-count"></span>
        <div class="sel-actions">
          <button type="button" class="btn sm act-download" title="Download"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span class="lbl">Download</span></button>
          <button type="button" class="btn sm act-copy" aria-haspopup="dialog" title="Copy to another location"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span class="lbl">Copy to…</span></button>
          <button type="button" class="btn sm act-move" aria-haspopup="dialog" title="Move to another location"><svg class="i" aria-hidden="true"><use href="#i-move"/></svg><span class="lbl">Move to…</span></button>
          <button type="button" class="btn sm act-compress hide-xs" title="Compress into an archive"><svg class="i" aria-hidden="true"><use href="#i-archive"/></svg><span class="lbl">Compress</span></button>
          <button type="button" class="btn sm act-rename hide-xs" title="Rename (F2)"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg><span class="lbl">Rename</span></button>
          <button type="button" class="btn sm danger act-delete" title="Delete (Del)"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg><span class="lbl">Delete</span></button>
          <button type="button" class="icon-btn sm act-more" aria-label="More actions" aria-haspopup="menu"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
        </div>
      </div>

      <div class="listing">
        <div class="list-head" aria-hidden="false">
          <button type="button" class="col col-name" data-sort="name"><span>Name</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
          <button type="button" class="col col-size" data-sort="size"><span>Size</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
          <button type="button" class="col col-mod" data-sort="mod"><span>Modified</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
        </div>
        <div class="grid" role="grid" tabindex="0" aria-multiselectable="true" aria-colcount="3">
          <div class="grid-spacer" role="presentation"></div>
        </div>
        <div class="grid-state" hidden></div>
      </div>

      <footer class="pane-status">
        <span class="status-text"></span>
        <span class="status-extra"></span>
      </footer>

      <div class="drop-overlay" aria-hidden="true">
        <div class="drop-card">
          <svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>
          <span>Drop to upload to <b class="drop-dest"></b></span>
        </div>
      </div>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
