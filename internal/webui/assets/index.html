  <a class="skip-link" href="#main">Skip to content</a>

  <header class="appbar">
    <div class="brand" aria-label="Cenvero Fleet">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" class="bm-bg"/><path class="bm-fg" d="M8 11.5a2.5 2.5 0 0 1 2.5-2.5h4l2 2h5a2.5 2.5 0 0 1 2.5 2.5v7a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 8 20.5z"/></svg>
      <span class="brand-name">Cenvero <b>Fleet</b></span>
    </div>

    <nav class="views" role="tablist" aria-label="Views">
      <button class="view-tab" role="tab" id="tab-files" data-view="files" aria-controls="view-files" aria-selected="true" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-folder"/></svg><span>Files</span>
      </button>
      <button class="view-tab" role="tab" id="tab-overview" data-view="overview" aria-controls="view-overview" aria-selected="false" tabindex="-1" type="button">
        <svg class="i" aria-hidden="true"><use href="#i-server"/></svg><span>Fleet</span>
        <span class="tab-badge" id="alert-badge" hidden></span>
      </button>
    </nav>

    <button class="search-trigger" id="open-palette" type="button" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">
      <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="st-label">Search files, servers &amp; commands</span>
      <kbd class="st-kbd" id="palette-kbd">Ctrl K</kbd>
    </button>

    <div class="appbar-actions">
      <button class="icon-btn transfers-btn" id="open-transfers" type="button" aria-controls="transfers-panel" aria-expanded="false" aria-label="Transfers" title="Transfers">
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle class="ring-track" cx="18" cy="18" r="15.5"/><circle class="ring-fill" id="transfer-ring" cx="18" cy="18" r="15.5" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>
        <svg class="i" aria-hidden="true"><use href="#i-transfer"/></svg>
        <span class="count-badge" id="transfer-count" hidden>0</span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle theme">
        <svg class="i" aria-hidden="true"><use href="#i-moon" id="theme-icon"/></svg>
      </button>
      <button class="icon-btn hide-narrow" id="open-help" type="button" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)" aria-haspopup="dialog" aria-keyshortcuts="Shift+?">
        <svg class="i" aria-hidden="true"><use href="#i-keyboard"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="main">
    <section id="view-files" class="view view-files" role="tabpanel" aria-labelledby="tab-files">
      <div class="pane-switcher" id="pane-switcher" role="tablist" aria-label="Panes"></div>
      <div id="panes" class="panes" data-count="2"></div>
    </section>

    <section id="view-overview" class="view view-overview" role="tabpanel" aria-labelledby="tab-overview" hidden>
      <div class="ov">
        <div class="ov-head">
          <div class="ov-title">
            <h1>Fleet overview</h1>
            <p class="ov-sub"><span id="ov-updated">Loading…</span> · read-only</p>
          </div>
          <div class="ov-controls">
            <label class="field search-field">
              <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
              <input id="ov-filter" type="search" placeholder="Filter: name, env=prod, OS…" title="Filter by server name, tag (env=prod) or OS" aria-label="Filter servers by name, tag or OS" spellcheck="false" autocomplete="off" />
            </label>
            <div class="segmented" id="ov-status" role="radiogroup" aria-label="Status filter">
              <button type="button" role="radio" aria-checked="true" data-status="all">All</button>
              <button type="button" role="radio" aria-checked="false" data-status="online" tabindex="-1">Online</button>
              <button type="button" role="radio" aria-checked="false" data-status="offline" tabindex="-1">Offline</button>
              <button type="button" role="radio" aria-checked="false" data-status="alerts" tabindex="-1">With alerts</button>
            </div>
            <button type="button" class="btn" id="ov-auto" aria-pressed="true" title="Auto-refresh every 10 seconds">
              <svg class="i" aria-hidden="true"><use href="#i-pause"/></svg><span>Auto-refresh</span>
            </button>
            <button type="button" class="icon-btn" id="ov-refresh" aria-label="Refresh now" title="Refresh now">
              <svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg>
            </button>
          </div>
        </div>
        <div class="ov-summary" id="ov-summary" aria-live="polite"></div>
        <div class="ov-notice" id="ov-notice" hidden></div>
        <div class="ov-table-wrap">
          <table class="ov-table" id="ov-table">
            <caption class="sr-only">Managed servers</caption>
            <thead>
              <tr>
                <th scope="col" class="c-status" aria-sort="none"><button type="button" data-sort="status">Status</button></th>
                <th scope="col" class="c-name" aria-sort="ascending"><button type="button" data-sort="name">Server</button></th>
                <th scope="col" class="c-mode" aria-sort="none"><button type="button" data-sort="mode">Mode</button></th>
                <th scope="col" class="c-os" aria-sort="none"><button type="button" data-sort="os">OS</button></th>
                <th scope="col" class="c-metric" aria-sort="none"><button type="button" data-sort="cpu">CPU</button></th>
                <th scope="col" class="c-metric" aria-sort="none"><button type="button" data-sort="mem">Memory</button></th>
                <th scope="col" class="c-metric" aria-sort="none"><button type="button" data-sort="disk">Disk</button></th>
                <th scope="col" class="c-seen" aria-sort="none"><button type="button" data-sort="seen">Last seen</button></th>
                <th scope="col" class="c-tags">Tags</th>
                <th scope="col" class="c-alerts" aria-sort="none"><button type="button" data-sort="alerts">Alerts</button></th>
                <th scope="col" class="c-open"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="ov-body"></tbody>
          </table>
          <div class="ov-empty" id="ov-empty" hidden></div>
        </div>
        <section class="ov-alerts" aria-labelledby="ov-alerts-title">
          <h2 id="ov-alerts-title">Open alerts</h2>
          <ul class="alert-list" id="ov-alerts"></ul>
        </section>
      </div>
    </section>
  </main>

  <!-- Transfers drawer -->
  <aside id="transfers-panel" class="drawer transfers-panel" aria-labelledby="transfers-title" hidden>
    <div class="drawer-head">
      <div class="drawer-title">
        <h2 id="transfers-title">Transfers</h2>
        <p class="drawer-sub" id="transfers-summary">Nothing in progress</p>
      </div>
      <button type="button" class="btn sm ghost" id="transfers-clear">Clear finished</button>
      <button type="button" class="icon-btn" id="transfers-close" aria-label="Close transfers">
        <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="overall" id="transfers-overall" hidden>
      <div class="bar"><span class="bar-fill" id="overall-fill"></span></div>
      <span class="overall-text" id="overall-text"></span>
    </div>
    <ol class="transfer-list" id="transfer-list" aria-live="polite"></ol>
    <p class="drawer-empty" id="transfers-empty">Uploads, downloads, copies and moves appear here. They keep running while you browse.</p>
  </aside>

  <!-- Preview drawer -->
  <aside id="preview-panel" class="drawer preview-panel" aria-labelledby="preview-title" hidden>
    <div class="drawer-head">
      <div class="preview-heading">
        <svg class="i preview-icon" aria-hidden="true"><use href="#i-file" id="preview-icon-use"/></svg>
        <h2 id="preview-title" class="truncate"></h2>
      </div>
      <button type="button" class="icon-btn" id="preview-close" aria-label="Close preview">
        <svg class="i" aria-hidden="true"><use href="#i-x"/></svg>
      </button>
    </div>
    <div class="preview-actions" id="preview-actions"></div>
    <div class="preview-body" id="preview-body"></div>
    <dl class="preview-meta" id="preview-meta"></dl>
  </aside>

  <!-- Floating menus (context menu, dropdowns, drop actions) -->
  <div id="menu" class="menu" role="menu" hidden></div>

  <!-- Modal dialogs -->
  <div id="modal-overlay" class="modal-overlay" hidden>
    <div id="modal" class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div id="toasts" class="toasts" role="region" aria-label="Notifications"></div>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

  <!-- Drag ghost (pointer-driven, follows cursor) -->
  <div id="ghost" class="drag-ghost" aria-hidden="true">
    <svg class="i ghost-icon"><use href="#i-file"/></svg>
    <span class="ghost-name"></span>
    <span class="ghost-badge"></span>
  </div>

  <!-- Full-screen text editor overlay (syntax-highlighted) -->
  <div id="editor-overlay" class="editor-overlay" hidden>
    <div class="editor" role="dialog" aria-modal="true" aria-labelledby="ed-name">
      <div class="editor-head">
        <div class="editor-title">
          <svg class="i ed-icon" aria-hidden="true"><use href="#i-file-code"/></svg>
          <span class="ed-name truncate" id="ed-name"></span>
          <span class="ed-lang" id="ed-lang"></span>
          <span class="ed-dirty" id="ed-dirty" hidden>Unsaved</span>
        </div>
        <div class="editor-actions">
          <span class="ed-meta" id="ed-meta"></span>
          <button id="ed-save" class="btn primary" type="button" aria-keyshortcuts="Control+S Meta+S">Save</button>
          <button id="ed-cancel" class="btn" type="button">Close</button>
        </div>
      </div>
      <div class="editor-body">
        <div class="ed-gutter" id="ed-gutter" aria-hidden="true"></div>
        <div class="ed-area">
          <pre class="ed-highlight" id="ed-highlight" aria-hidden="true"><code></code></pre>
          <textarea class="ed-input" id="ed-input" spellcheck="false" autocomplete="off"
            autocapitalize="off" autocorrect="off" wrap="off" aria-label="File content"></textarea>
        </div>
      </div>
    </div>
  </div>

  <template id="pane-template">
    <section class="pane" role="region">
      <header class="pane-head">
        <div class="source">
          <svg class="i source-icon" aria-hidden="true"><use href="#i-laptop"/></svg>
          <select class="source-select" aria-label="Source"></select>
          <svg class="i source-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </div>
        <div class="nav">
          <button type="button" class="icon-btn sm nav-back" aria-label="Back" title="Back (Alt+←)" aria-keyshortcuts="Alt+ArrowLeft"><svg class="i" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
          <button type="button" class="icon-btn sm nav-fwd" aria-label="Forward" title="Forward (Alt+→)" aria-keyshortcuts="Alt+ArrowRight"><svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
          <button type="button" class="icon-btn sm nav-up" aria-label="Up one level" title="Up one level (Backspace)" aria-keyshortcuts="Backspace Alt+ArrowUp"><svg class="i" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
        </div>
        <div class="location">
          <nav class="crumbs" aria-label="Path"><ol class="crumb-list"></ol></nav>
          <input type="text" class="path-input" aria-label="Go to path" spellcheck="false" autocomplete="off" autocapitalize="off" hidden />
        </div>
        <div class="head-actions">
          <button type="button" class="icon-btn sm act-refresh" aria-label="Refresh" title="Refresh"><svg class="i" aria-hidden="true"><use href="#i-refresh"/></svg></button>
          <button type="button" class="icon-btn sm act-pane-menu" aria-label="Pane options" aria-haspopup="menu" title="More"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
          <button type="button" class="icon-btn sm act-close" aria-label="Close pane" title="Close pane"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </header>

      <div class="pane-toolbar">
        <label class="field filter">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input class="filter-input" type="search" placeholder="Filter this folder" aria-label="Filter this folder" spellcheck="false" autocomplete="off" />
          <kbd class="filter-kbd" aria-hidden="true">/</kbd>
        </label>
        <div class="tools">
          <button type="button" class="btn ghost tool-newfolder" title="New folder"><svg class="i" aria-hidden="true"><use href="#i-folder-plus"/></svg><span class="lbl">New folder</span></button>
          <button type="button" class="btn ghost tool-upload" title="Upload files"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span class="lbl">Upload</span></button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button type="button" class="icon-btn sm tool-hidden" aria-pressed="false" aria-label="Show hidden files" title="Show hidden files (.)"><svg class="i" aria-hidden="true"><use href="#i-eye-off"/></svg></button>
          <button type="button" class="icon-btn sm tool-view" aria-pressed="false" aria-label="Icon view" title="Toggle icon view (V)"><svg class="i" aria-hidden="true"><use href="#i-grid"/></svg></button>
          <button type="button" class="icon-btn sm tool-preview" aria-pressed="false" aria-label="Preview panel" title="Preview (P)"><svg class="i" aria-hidden="true"><use href="#i-panel"/></svg></button>
        </div>
        <input type="file" class="file-input" multiple hidden tabindex="-1" />
      </div>

      <div class="selbar" role="toolbar" aria-label="Selection" hidden>
        <button type="button" class="icon-btn sm sel-clear" aria-label="Clear selection" title="Clear selection (Esc)"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button>
        <span class="sel-count"></span>
        <div class="sel-actions">
          <button type="button" class="btn sm act-download" title="Download"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span class="lbl">Download</span></button>
          <button type="button" class="btn sm act-copy" aria-haspopup="dialog" title="Copy to another location"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span class="lbl">Copy to…</span></button>
          <button type="button" class="btn sm act-move" aria-haspopup="dialog" title="Move to another location"><svg class="i" aria-hidden="true"><use href="#i-move"/></svg><span class="lbl">Move to…</span></button>
          <button type="button" class="btn sm act-compress hide-xs" title="Compress into an archive"><svg class="i" aria-hidden="true"><use href="#i-archive"/></svg><span class="lbl">Compress</span></button>
          <button type="button" class="btn sm act-rename hide-xs" title="Rename (F2)"><svg class="i" aria-hidden="true"><use href="#i-edit"/></svg><span class="lbl">Rename</span></button>
          <button type="button" class="btn sm danger act-delete" title="Delete (Del)"><svg class="i" aria-hidden="true"><use href="#i-trash"/></svg><span class="lbl">Delete</span></button>
          <button type="button" class="icon-btn sm act-more" aria-label="More actions" aria-haspopup="menu"><svg class="i" aria-hidden="true"><use href="#i-more"/></svg></button>
        </div>
      </div>

      <div class="listing">
        <div class="list-head" aria-hidden="false">
          <button type="button" class="col col-name" data-sort="name"><span>Name</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
          <button type="button" class="col col-size" data-sort="size"><span>Size</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
          <button type="button" class="col col-mod" data-sort="mod"><span>Modified</span><svg class="i sort-ico" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
        </div>
        <div class="grid" role="grid" tabindex="0" aria-multiselectable="true" aria-colcount="3">
          <div class="grid-spacer" role="presentation"></div>
        </div>
        <div class="grid-state" hidden></div>
      </div>

      <footer class="pane-status">
        <span class="status-text"></span>
        <span class="status-extra"></span>
      </footer>

      <div class="drop-overlay" aria-hidden="true">
        <div class="drop-card">
          <svg class="i" aria-hidden="true"><use href="#i-upload"/></svg>
          <span>Drop to upload to <b class="drop-dest"></b></span>
        </div>
      </div>
    </section>
  </template>

  <script src="/app.js"></script>
</body>
</html>
